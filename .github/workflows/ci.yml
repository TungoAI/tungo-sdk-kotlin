# Generated by tungo-sdkgen. Do not edit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, API check, tests on JDK ${{ matrix.test-jdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported runtime. Gradle itself runs on JDK 17.
        test-jdk: ['8', '21']
    env:
      TEST_JDK: ${{ matrix.test-jdk }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.test-jdk }}
            17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check that the version is the same everywhere
        run: |
          version="$(sed -n 's/^version = "\([0-9.]*\)".*/\1/p' build.gradle.kts)"
          bash scripts/release-version.sh check "${version}"
      # "build" compiles the SDK in explicit API mode with warnings as errors, compiles the
      # examples, checks the public API dump, runs the tests and builds the sources and javadoc jars.
      - name: Build and test
        run: sh ./gradlew --no-daemon --stacktrace build -PtestJdk="${TEST_JDK}"

  install:
    name: Install the package into a clean project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Publish to the local Maven repository
        run: sh ./gradlew --no-daemon --stacktrace publishToMavenLocal -PskipSigning=true
      - name: Build and run a project that depends on the published artifact
        run: sh ./gradlew --no-daemon --stacktrace -p consumer-test run
