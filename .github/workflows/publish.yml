# Generated by tungo-sdkgen. Do not edit.
#
# Publishes kz.tungo:tungo-sdk-kotlin (Maven Central) when a tag vX.Y.Z is pushed. To retry a failed
# release, run this workflow manually FROM THE TAG (gh workflow run publish.yml --ref vX.Y.Z).
# The job fails when a credential is missing or the registry does not serve the new version.
#
# Repository setup:
#   - environment "release" (add required reviewers there to gate publishing)
#   - secrets CENTRAL_USERNAME and CENTRAL_PASSWORD (user token generated on central.sonatype.com)
#   - secrets MAVEN_GPG_PRIVATE_KEY (ASCII-armoured) and MAVEN_GPG_PASSPHRASE; the namespace kz.tungo verified on Central
#   - optional: repository variable PUBLISH_GITHUB_PACKAGES=true to also publish to GitHub Packages
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set and verify the version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a release tag vX.Y.Z (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}')."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-version.sh set "${version}"
          bash scripts/release-version.sh check-release "${version}"
          if ! git diff --exit-code; then
            echo "::error::The commit tagged ${GITHUB_REF_NAME} carries a different version. Bump VERSION in tungo-sdkgen, regenerate, commit, and tag the new commit with a new version."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Maven Central
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require registry credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret ${name} is not set."
              missing=1
            fi
          done
          exit "${missing}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Sign and publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          ./gradlew --no-daemon --stacktrace publishAndReleaseToMavenCentral
          test -f "build/libs/tungo-sdk-kotlin-${VERSION}.jar"
      - name: Wait until Maven Central serves the new version
        env:
          URL: https://repo1.maven.org/maven2/kz/tungo/tungo-sdk-kotlin/${{ needs.preflight.outputs.version }}/tungo-sdk-kotlin-${{ needs.preflight.outputs.version }}.pom
        run: |
          for attempt in $(seq 1 180); do
            if curl -fsS -A tungo-sdk-release -o /dev/null "${URL}"; then
              echo "${URL} is available."
              exit 0
            fi
            echo "Not available yet (attempt ${attempt})."
            sleep 10
          done
          echo "::error::Maven Central did not serve version ${VERSION} within 30 minutes: ${URL}"
          exit 1
      - name: Publish to GitHub Packages
        if: vars.PUBLISH_GITHUB_PACKAGES == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew --no-daemon --stacktrace publishAllPublicationsToGitHubPackagesRepository

  github-release:
    name: GitHub release
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the CHANGELOG entry
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { printing = 1; next }
            /^## \[/ { printing = 0 }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [[ ! -s "${RUNNER_TEMP}/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no notes for ${VERSION}."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
